<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Costco and Trader Joe's Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: deep-green masthead that holds the store switch, pale sage paper, produce-colored
   plate glyphs that show what is in each recipe, and a bottom tab bar for one-handed use in the aisle. */
:root{
  --bg:#f0f4ed; --surface:#ffffff; --ink:#13261b; --muted:#56675c; --line:#d8e0d6; --soft:#e7eee4;
  --brand:#165c39; --brand-ink:#ffffff; --lemon:#f4b72c; --lemon-ink:#2a1f00;
  --hero:#0f3b27; --hero-ink:#f2f7f0; --hero-mute:#a9c4b3;
  --sc:#2457c5; --sc-bg:#e2eafb; --st:#bf3326; --st-bg:#fbe4e0;
  --warn:#b3261e; --warn-bg:#f9e1de; --freeze:#1a5d8c; --freeze-bg:#dbebf6; --fresh:#2a6a1b; --fresh-bg:#e1eed9;
  --r-protein:#e0674a; --r-legume:#b07a3d; --r-grain:#e2b24a; --r-veg:#3f9c4e; --r-fat:#9db63c; --r-fruit:#8f5fc0; --r-dairy:#8fb3dd;
  --shadow:0 1px 2px rgba(19,38,27,.06),0 6px 18px rgba(19,38,27,.05);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1511; --surface:#16201a; --ink:#e8efe9; --muted:#9aaa9f; --line:#2a3a30; --soft:#1d2b23;
    --brand:#63d199; --brand-ink:#08170f; --hero:#0a2418; --hero-ink:#eef5ee; --hero-mute:#8fb09c;
    --sc:#8fb0ff; --sc-bg:#1b2a4d; --st:#ff9a8c; --st-bg:#44221d;
    --warn:#ff9a90; --warn-bg:#3d201d; --freeze:#86c8f0; --freeze-bg:#1b3040; --fresh:#a3d985; --fresh-bg:#223520;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1511; --surface:#16201a; --ink:#e8efe9; --muted:#9aaa9f; --line:#2a3a30; --soft:#1d2b23;
  --brand:#63d199; --brand-ink:#08170f; --hero:#0a2418; --hero-ink:#eef5ee; --hero-mute:#8fb09c;
  --sc:#8fb0ff; --sc-bg:#1b2a4d; --st:#ff9a8c; --st-bg:#44221d;
  --warn:#ff9a90; --warn-bg:#3d201d; --freeze:#86c8f0; --freeze-bg:#1b3040; --fresh:#a3d985; --fresh-bg:#223520;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* masthead */
.hero{background:var(--hero);color:var(--hero-ink);padding:calc(14px + env(safe-area-inset-top)) 0 14px;border-radius:0 0 18px 18px}
.hero .wrap{display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font:600 14px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--hero-mute)}
.brand svg{flex:none}
.status b{color:var(--hero-ink);font-weight:600}
main{padding-top:22px}
/* type */
h2{font:700 28px/1.05 var(--display);letter-spacing:-.015em;margin:0 0 4px}
h3{font:600 17px/1.25 var(--body);margin:0}
.lead{color:var(--muted);margin:0 0 14px;max-width:62ch}
.meta{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
/* controls */
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.small{min-height:36px;padding:4px 10px;font-size:13px}
.btn.ghost{border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
select{background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:7px 8px;min-height:42px;max-width:100%}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);line-height:1.35}
.chip.fresh{background:var(--fresh-bg);color:var(--fresh)}
.chip.freeze{background:var(--freeze-bg);color:var(--freeze)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.plain{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-weight:500}
.chip.sc{background:var(--sc-bg);color:var(--sc)} .chip.st{background:var(--st-bg);color:var(--st)}
/* household */
#app a:not(.btn){color:var(--brand);font-weight:600}
.famline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px}
.famline a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.choices{display:grid;gap:8px}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{text-align:left;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;min-height:44px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);font-size:14.5px}
.choice span{font-size:13px;color:var(--muted);font-weight:400}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--soft);box-shadow:inset 0 0 0 1px var(--brand)}
.tune-g{margin:8px 0 0;font:600 13px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tune{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-top:1px solid var(--line)}
.tune label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14.5px}
.tune output{font-variant-numeric:tabular-nums;color:var(--brand);white-space:nowrap}
.tune input[type=range]{width:100%;min-height:44px;accent-color:var(--brand);margin:0}
.stepn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:14px;margin-right:8px;vertical-align:1px}
.keep{margin-top:6px}
.keep summary{font-size:13.5px;color:var(--muted);font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
.keep .stepper button{width:38px;height:36px}
.keep .stepper output{font-size:18px}
.disc{display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--brand)}
.disc.t-season{border-top-color:var(--lemon)} .disc.t-health{border-top-color:var(--r-fruit)} .disc.t-family{border-top-color:var(--r-legume)} .disc.t-world{border-top-color:var(--r-protein)}
.disc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.disc-theme{font-size:22px}
.plates{display:flex;gap:4px;flex-wrap:wrap}
.plates .glyph{width:40px;height:40px}
.disc-list{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:2px}
.disc-all{display:grid;gap:8px;margin-top:8px;font-size:14px}
.disc-all ul{margin:2px 0 0;padding-left:18px}
.chip .x{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;padding:0 0 0 6px;color:inherit;min-width:32px;min-height:32px}
.macro{margin:8px 0 0;font-size:14px;background:var(--soft);border-radius:10px;padding:8px 11px}
.macro .meta{font-size:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-t{min-height:44px;border:1.5px solid var(--line);background:transparent;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);padding:0}
.day-t[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:10px;width:max-content}
.stepper button{border:0;background:transparent;width:42px;height:40px;font-size:20px;cursor:pointer}
.stepper output{min-width:34px;text-align:center;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
/* plate glyph */
.glyph .rim{fill:var(--ink);opacity:.14} .glyph .plate{fill:var(--surface)}
.glyph .wedges path,.glyph .wedges circle{stroke:var(--surface);stroke-width:2.5;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* week */
.day{display:grid;grid-template-columns:48px 1fr 56px;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.day.s-fresh::before{background:var(--fresh)} .day.s-freeze::before{background:var(--freeze)} .day.s-warn::before{background:var(--warn)}
.dow{font:700 24px/1 var(--display);text-transform:uppercase;padding-left:4px}
.dow small{display:block;font:700 10px/1.2 var(--body);color:var(--brand);letter-spacing:.05em;margin-top:5px}
.day .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.day[data-key]{cursor:pointer}
.day.open{cursor:auto}
.rtitle{all:unset;cursor:pointer;display:inline-flex;align-items:flex-start;gap:6px;font:inherit;color:inherit}
.rtitle:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
.rtitle svg{flex:none;width:18px;height:18px;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);transition:transform .15s}
.day.open .rtitle svg{transform:rotate(180deg)}
.day .more{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.prep{background:var(--lemon);color:var(--lemon-ink);border-radius:16px;padding:14px 16px}
.prep h3{font:700 20px/1.1 var(--display);margin-bottom:6px}
.prep ul{margin:0;padding-left:18px} .prep li{margin:4px 0;font-size:14.5px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}

[hidden]{display:none!important}
.dayg{display:flex;flex-direction:column;gap:8px}
.dayh{font:700 22px/1 var(--display);display:flex;align-items:baseline;gap:10px;margin:10px 0 0}
.dayh small{font:700 10px/1 var(--body);color:var(--brand);letter-spacing:.06em}
.dayg .day{grid-template-columns:50px 1fr 48px}
.dayg .dow{font:700 11px/1.2 var(--body);letter-spacing:.06em;color:var(--muted);padding-left:4px;padding-top:2px}
.gen{display:flex;flex-direction:column;gap:12px}
.gen h3{font:700 20px/1.1 var(--display)}
.gen summary{cursor:pointer;font-weight:700;font-size:14px}
.presets{display:grid;gap:8px;margin-top:10px}
.preset{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.preset b{font-size:15px} .preset span{font-size:13px;color:var(--muted)}
.preset:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.incoming{border:2px solid var(--brand);display:flex;flex-direction:column;gap:8px}
.empty{padding:14px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14.5px}
.search{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;font:inherit;font-size:16px}
/* recipes */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .btn{white-space:nowrap}
.recipe{display:flex;flex-direction:column;gap:10px}
.recipe .head{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start}
.recipe .time{font:700 24px/1 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.recipe .time small{display:block;font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px}
.ing{list-style:none;margin:10px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px;font-size:14px}
.ing li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:4px 0}
.ing b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps{margin:8px 0 0;padding-left:20px;font-size:14.5px;max-width:65ch} ol.steps li{margin:4px 0}
.kid{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 11px;max-width:65ch}
.kid b{font-weight:700}
.tips{margin:6px 0 0;padding-left:18px;font-size:14.5px;max-width:65ch} .tips li{margin:4px 0}
/* shopping */
.store-head{display:flex;align-items:center;gap:10px;margin:20px 0 6px;padding:10px 14px;border-radius:12px;font-weight:700}
.store-head h2{font-size:24px;margin:0}
.store-head .meta{margin-left:auto;color:inherit;opacity:.8}
.store-head.s-c{background:var(--sc-bg);color:var(--sc)} .store-head.s-t{background:var(--st-bg);color:var(--st)} .store-head.s-x{background:var(--soft);color:var(--muted)}
.cat{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:grid;grid-template-columns:auto 60px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.item input[type=checkbox]{width:24px;height:24px;margin:5px 0 0;accent-color:var(--brand)}
.item.done{opacity:.5} .item.done h3{text-decoration:line-through}
.placard{background:var(--ink);color:var(--bg);text-align:center;padding:6px 2px 7px;border-radius:10px}
.placard b{display:block;font:700 34px/.95 var(--display);font-variant-numeric:tabular-nums}
.placard span{display:block;font:600 10.5px/1.2 var(--body);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.s-c .placard{background:var(--sc);color:#fff} .s-t .placard{background:var(--st);color:#fff}
.group.s-c .placard{background:var(--sc);color:#fff} .group.s-t .placard{background:var(--st);color:#fff}
.use{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:7px 0 5px}
.use i{display:block;height:100%;background:var(--brand);border-radius:99px}
.item .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .nums{font-size:13.5px;font-variant-numeric:tabular-nums}
.pantry{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px}
.pantry label{display:flex;gap:8px;align-items:center;font-size:14.5px}
.pantry input{width:20px;height:20px;accent-color:var(--brand)}
.copybox{width:100%;min-height:220px;font-family:inherit;font-size:16px;line-height:1.45;padding:10px;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink)}
.foot{font-size:13px;color:var(--muted);margin:30px 0 0;max-width:70ch}
/* bottom bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(19,38,27,.07)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:12px;position:relative}
nav.tabs a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--brand);background:var(--soft)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--st);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px}
.badge:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (max-width:420px){ .day{grid-template-columns:46px 1fr 48px;gap:10px} .dow{font-size:19px;padding-left:2px} .day .glyph{width:48px;height:48px} .recipe .head{grid-template-columns:48px 1fr auto} .recipe .head .glyph{width:48px;height:48px} }
.dayg .day{grid-template-columns:62px 1fr 48px}
@media (prefers-reduced-motion:reduce){ #toast,.rtitle svg{transition:none} }
</style>
</head>

<header class="hero">
  <div class="wrap">
    <div class="brand"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#f2f7f0" opacity=".18"/><circle cx="32" cy="32" r="25" fill="#f2f7f0"/><path d="M32 32L32 10A22 22 0 0 1 51 43Z" fill="#e0674a"/><path d="M32 32L51 43A22 22 0 0 1 13 43Z" fill="#3f9c4e"/><path d="M32 32L13 43A22 22 0 0 1 32 10Z" fill="#e2b24a"/></svg><span>Week planner</span></div>
  </div>
</header>
<div class="wrap">
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Sections">
  <a href="#week" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</a>
  <a href="#recipes" data-tab="recipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></svg>Recipes</a>
  <a href="#profile" data-tab="profile" id="profile-link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="10" r="2.3"/><path d="M3.5 19c.6-3.4 2.8-5.2 5.5-5.2s4.9 1.8 5.5 5.2M14.5 15.2c.8-.9 1.6-1.3 2.5-1.3 2 0 3.3 1.5 3.6 5.1"/></svg>Family</a>
  <a href="#discover" data-tab="discover" id="discover-link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a>
  <a href="#shopping-list" data-tab="shopping-list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>Shop<span class="badge" id="badge"></span></a>
</nav>

<script>
"use strict";
/* ---------- data ---------- */
const CATS=["Produce","Meat & fish","Dairy & eggs","Frozen","Pantry"];
const I={

  const cnt={}; for(const k in ing){const ro=I[k].role; if(ro) cnt[ro]=(cnt[ro]||0)+1;}
  const order=["protein","legume","grain","veg","fat","fruit","dairy"], ents=order.filter(o=>cnt[o]), tot=ents.reduce((a,o)=>a+cnt[o],0);

  const now=new Date().getMonth()+1, day=dayNum();
  const inSeason=PRESETS.filter(p=>p.months&&p.months.includes(now));
  const pickFrom=inSeason.length?inSeason:PRESETS.filter(p=>p.theme!=="season"), pick=pickFrom[day%pickFrom.length];
  const seasonFirst=t=>t.k==="season"?(inSeason.length?-1:9):0;
  const themes=rot(THEMES.filter(t=>t.k!=="season"),day).concat(THEMES.filter(t=>t.k==="season")).sort((a,b)=>seasonFirst(a)-seasonFirst(b));
  const groups=themes.map(t=>{let ps=rot(PRESETS.filter(p=>p.theme===t.k&&p!==pick),day); if(!ps.length) return "";
    if(t.k==="season") ps=ps.filter(p=>inSeason.includes(p)).concat(ps.filter(p=>!inSeason.includes(p)));
    return `<section class="stack"><div><h2 class="disc-theme">${t.name}</h2><p class="meta" style="margin:2px 0 0">${t.desc}</p></div>${ps.map(presetCard).join("")}</section>`;}).join("");
  return `<section class="stack"><div><h2>Discover</h2><p class="lead">Sample weeks to start from, in a new order each day. Using one replaces the meals it includes; swap anything after.</p></div>
    <section class="stack"><div><h2 class="disc-theme">Today's pick</h2></div>${presetCard(pick)}</section>${groups}</section>`;
}

function viewWeek(){

    const s=storeFor(k,T[k]); if(!s) continue;
    let lateQ=0; const lateDays=[];

    if(lateQ) prep.push(`Freeze ${fq(lateQ,it.u)} of ${it.s} for ${list([...new Set(lateDays)])}. Move it to the fridge the night before.`);
    const over=packsAt(k,T[k],s)*I[k][s].q-T[k];

  const it=I[k], base=it.life, l=lifeOf(k), mine=own(S.life,k);
  const sum=base==null?(it.cat==="Frozen"?"Freezer":"Pantry"):`Keeps about ${l} day${l>1?"s":""}${mine?" (your number)":""}`;
  const edit=base==null?"":`<div class="row" style="align-items:center"><span class="meta">In your fridge it lasts</span><div class="stepper" role="group" aria-label="Days ${it.s} lasts"><button id="life-${k}-m" data-act="life" data-id="${k}" data-d="-1" aria-label="One day less">−</button><output>${l}</output><button id="life-${k}-p" data-act="life" data-id="${k}" data-d="1" aria-label="One day more">+</button></div><span class="meta">days</span>${mine?`<button class="btn small ghost" id="life-reset-${k}" data-act="life-reset" data-id="${k}">Use ${base}</button>`:""}</div><p class="meta" style="margin:0">The planner uses this for cook-or-freeze reminders and waste.</p>`;
  return `<details class="keep" data-sk="${k}" ${openStore.has(k)?"open":""}><summary>${sum}</summary><p class="meta" style="margin:6px 0 0">${it.keep}</p>${edit}</details>`;
}
function itemRow(l,planned){
  const k=l.k, it=I[k], sd=it[l.s], pct=Math.min(100,Math.round(l.need/l.tot*100)), over=l.tot-l.need;
  let ideas="";
  if(lifeOf(k)!=null&&lifeOf(k)<=tw("spoil")&&pct<tw("ideas")){const more=R.filter(r=>r.ing[k]&&!planned.has(r.id)&&avail(r)).slice(0,2);
    if(more.length) ideas=`<div class="row"><span class="meta">Use more of it:</span>${more.map(r=>`<button class="btn small ghost" id="idea-${k}-${r.id}" data-act="add" data-id="${r.id}">+ ${r.n}</button>`).join("")}</div>`;}
  const other=l.s==="c"?"t":"c";
  const swap=S.store==="both"&&it.c&&it.t?`<div class="row"><button class="btn small ghost" id="swap-${k}" data-act="swap" data-id="${k}">Buy at ${STORE_LBL[other]} instead</button></div>`:"";
  const unit=sd.loose?"pcs":(l.p>1?"packs":"pack");
  return `<div class="item ${S.checked[k]?"done":""}"><input type="checkbox" id="chk-${k}" data-act="check" data-id="${k}" ${S.checked[k]?"checked":""} aria-label="${sd.n} is in the cart">
    <div class="placard" aria-hidden="true"><b>${l.p}</b><span>${unit}</span></div>
    <div class="info"><h3><label for="chk-${k}">${sd.n}</label></h3><div class="meta">${sd.loose?"Sold individually":`Buy ${l.p} × ${sd.pack}`}</div>
      <div class="use" role="img" aria-label="${pct}% of what you buy is used this week"><i style="width:${pct}%"></i></div>
      ${l.need?`<div class="nums">This week uses <b>${fq(l.need,it.u)}</b>, ${pct}% of what you buy.${pct<95&&!/^0\b/.test(fq(over,it.u,1))?` About ${fq(over,it.u,1)} left over.`:""}${l.stock?" Also on your keep-stocked list.":""}</div>`:`<div class="nums">On your keep-stocked list.</div>`}
      ${pct<95&&l.need?`<div class="meta">${sd.left||it.left}</div>`:""}${ideas}${swap}${storeInfo(k)}</div></div>`;
}
function viewShop(){
  const {T,st,lines,missing}=plan();
  if(!lines.length&&!missing.length) return `<section class="stack"><h2>Shopping list</h2><p class="lead">Your week is empty. Add a few recipes and the list builds itself.</p><a class="btn primary" href="#recipes" style="width:max-content;text-decoration:none;display:inline-flex;align-items:center">Browse recipes</a></section>`;
  const planned=new Set(slots().map(s=>s.x.r));
  const stores=S.store==="both"?["c","t"]:[S.store];
  let html="";
  for(const s of stores){
    const mine=lines.filter(l=>l.s===s); if(!mine.length) continue;
    const npk=mine.reduce((a,l)=>a+l.p,0);
    html+=`<div class="group s-${s}"><div class="store-head s-${s}"><h2>${STORE_LBL[s]}</h2><span class="meta">${mine.length} item${mine.length>1?"s":""}, ${npk} pack${npk>1?"s":""}</span></div>`;
    for(const cat of CATS){
      const rows=mine.filter(l=>I[l.k].cat===cat).sort((a,b)=>I[a.k][s].n.localeCompare(I[b.k][s].n)); if(!rows.length) continue;
      html+=`<div class="cat">${cat}</div>`+rows.map(l=>itemRow(l,planned)).join("");
    }
    html+=`</div>`;
  }
  if(missing.length){
    html+=`<div class="store-head s-x"><h2>Not at ${STORE_LBL[S.store]}</h2><span class="meta">${missing.length} item${missing.length>1?"s":""}</span></div><p class="meta" style="margin:0 0 8px">Swap the recipe, find these elsewhere, or choose Both under <a href="#profile">Family</a>.</p>`;
    html+=missing.map(k=>{const rs=[...planned].filter(id=>RX[id].ing[k]).map(id=>RX[id].n);
      return `<div class="card" style="margin-bottom:8px"><h3>${nm(k)}</h3><div class="meta">Needed for ${list(rs)}</div></div>`;}).join("");
  }
  const pantry=st.map(x=>{const key="st:"+x; return `<li><label><input type="checkbox" id="chk-${key.replace(/[^a-z]/g,"-")}" data-act="check" data-id="${key}" ${S.checked[key]?"checked":""}>${x}</label></li>`;}).join("");
  return `<section class="stack">
    <div><h2>Shopping list</h2><p class="meta" style="margin:4px 0 8px">Shopping at ${S.store==="both"?"Costco and Trader Joe's":STORE_LBL[S.store]}. <a href="#profile" id="change-store">Change</a> · <span id="grab"></span></p><p class="lead">Rounded up to whole packs${S.store==="both"?", each at the store that wastes less":""}. The bar shows how much of each pack the week uses.</p></div>
    ${html}
    ${st.length?`<div class="cat">Check at home</div><div class="card"><ul class="pantry">${pantry}</ul></div>`:""}
    <div class="row">${navigator.share?`<button class="btn primary" id="share" data-act="share">Share list</button>`:""}<button class="btn ${navigator.share?"ghost":"primary"}" id="copy" data-act="copy">Copy list as text</button><button class="btn ghost" id="uncheck" data-act="uncheck">Clear all ticks</button></div>
    <textarea class="copybox" id="copybox" readonly hidden aria-label="Shopping list as text"></textarea>
  </section>`;
}

/* Plain-text shopping list for sharing. Items already ticked are listed once at the end. */
function listText(){
  const {lines,st,missing}=plan(), out=[`Shopping list, ${dayName(0,true)}`], got=[];
  const stores=S.store==="both"?["c","t"]:[S.store];
  for(const s of stores){
    const mine=lines.filter(l=>l.s===s); if(!mine.length) continue;
    out.push("",STORE_LBL[s].toUpperCase());
    for(const cat of CATS){
      const rows=mine.filter(l=>I[l.k].cat===cat).sort((a,b)=>I[a.k][s].n.localeCompare(I[b.k][s].n)), left=[];
      rows.forEach(l=>{const sd=I[l.k][s]; if(S.checked[l.k]) got.push(sd.n);
        else left.push(`- ${sd.n}: ${sd.loose?`${Math.max(1,Math.ceil(l.need-1e-6))} loose`:`${l.p} x ${sd.pack}`} (${l.need?`this week uses ${fq(l.need,I[l.k].u)}`:"kept stocked"})`);});
      if(left.length) out.push(cat,...left);
    }
  }
  if(missing.length) out.push("","NOT AT "+STORE_LBL[S.store].toUpperCase()+": "+missing.map(nm).join(", "));
  const home=st.filter(x=>!S.checked["st:"+x]);
  if(home.length) out.push("","CHECK AT HOME: "+home.join(", "));
  if(got.length) out.push("","Already in the cart: "+got.join(", "));
  return out.join("\n");
}
function copyText(text){
  const fallback=()=>{const box=$("#copybox"); if(!box){toast("Copying is blocked here."); return;}
    box.value=text; box.hidden=false; box.focus(); box.select(); toast("Copying is blocked here. The list is selected below, so copy it from there.");};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(()=>toast("List copied"),fallback);
  else fallback();
}

/* ---------- share a week ----------
   A week travels as ?week=<code>#week, where the code is base64url JSON. Only the week and the
   household it was sized for travel; ticks and planner settings stay with each person. */
const SHARE_FIELDS=["adults","kids","kidPortion","shopDay","store","src","nb","nl","nd","ns","ne","np","bf","lunches","dinners","snacks","desserts","sips"];
const b64enc=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64dec=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; return decodeURIComponent(escape(atob(t)));};
function weekCode(){
  const o={v:1}; for(const f of SHARE_FIELDS) o[f]=S[f];
  for(const m of MK) o[MEALS[m].arr]=arr(m).map(x=>x?(x.double?[x.r,1]:x.r):0);
  return b64enc(JSON.stringify(o));
}
const pageURL=()=>location.href.split(/[?#]/)[0];
const weekLink=()=>pageURL()+"?week="+weekCode()+"#week";
/* Returns {data, meals, dropped} or null when the code does not hold a week. */
function readWeekCode(raw){
  try{
    let code=String(raw||"").trim(); const at=code.indexOf("week=");
    if(at>=0) code=code.slice(at+5).split(/[&#\s]/)[0];
    if(!code||code.length>8000) return null;
    const o=JSON.parse(b64dec(code)); if(!o||typeof o!=="object"||o.v!==1) return null;
    let sent=0;
    for(const m of MK){let a=o[MEALS[m].arr]; if(a==null&&(m==="s"||m==="e"||m==="p")) a=[]; /* links from before snacks */ if(!Array.isArray(a)) return null;
      o[MEALS[m].arr]=a.slice(0,7).map(x=>{const id=Array.isArray(x)?x[0]:x; if(typeof id!=="string") return null; sent++; return {r:id,double:Array.isArray(x)&&x[1]===1};});}
    const data=normalize(o); let meals=0;
    for(const m of MK) meals+=data[MEALS[m].arr].filter(Boolean).length;
    return {data,meals,dropped:sent-meals};
  }catch(e){return null;}
}
function weekText(){
  const out=[`Our week, shopping on ${DAYL[S.shopDay]}`];
  for(let i=0;i<7;i++){
    const rows=MK.filter(m=>i<cnt(m)&&arr(m)[i]).map(m=>{const x=arr(m)[i]; return `- ${MEALS[m].lbl}: ${RX[x.r].n}${x.double?" (cook double)":""}`;});
    if(rows.length) out.push("",dayName(i,true),...rows);
  }
  out.push("","Open it in the planner to see recipes and the shopping list:",weekLink());
  return out.join("\n");
}
let incoming=null;
function dropWeekQuery(){if(location.search) history.replaceState(null,"",pageURL()+location.hash);}
{const q=new URLSearchParams(location.search).get("week");
  if(q){incoming=readWeekCode(q); if(!incoming){dropWeekQuery(); setTimeout(()=>toast("That link does not hold a week the planner can read."),0);}}}


/* ---------- render + events ---------- */
function tab(){const h=location.hash.slice(1); return h==="shelf-life"?"shopping-list":TABS.includes(h)?h:"week";}
function render(){
  applyRotis();
  const t=tab(), fid=document.activeElement&&document.activeElement.id;
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===t) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");});
  $("#app").innerHTML=t==="week"&&!S.setup&&!incoming&&!slots().length?viewWelcome():t==="profile"?viewProfile():t==="discover"?viewDiscover():t==="recipes"?viewRecipes():t==="shopping-list"?viewShop():viewWeek();
  if(t==="recipes") applySearch();
  renderStatus();
  if(fid&&fid!=="rq"){const el=document.getElementById(fid); if(el&&!el.disabled) el.focus({preventScroll:true});}
}
let toastT=null;
function toast(m){const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2600);}

function act(el,ev){
  applyRotis();
  const a=el.dataset.act, d=+el.dataset.day, m=el.dataset.m;
  if(a==="filter"){filter=el.dataset.f; render(); return;}
  if(a==="cuisine"){if(ev.type!=="change") return; cuisine=el.value; render(); return;}
  if(a==="diet"){if(ev.type!=="change") return; diet=el.value; render(); return;}
  if(a==="style-pick"){if(ev.type!=="change") return; style=el.value; render(); return;}
  if(a==="open"){const k=el.dataset.key; if(openWeek.has(k)) openWeek.delete(k); else openWeek.add(k); render(); return;}
  if(a==="tune"){if(ev.type!=="change") return; const t=TUNEX[el.dataset.k], v=fromSlider(t,+el.value); if(v===t.def) delete S.tune[t.k]; else S.tune[t.k]=v;
    const rb=$("#tune-reset"); if(rb) rb.disabled=!Object.keys(S.tune).length; persist(); return;}
  if(a==="share"){
    const text=listText();
    navigator.share({title:"Shopping list",text}).catch(e=>{if(!e||e.name!=="AbortError") copyText(text);});
    return;
  }
  if(a==="copy"){copyText(listText()); return;}
  if(a==="share-week"){const text=weekText(); navigator.share({title:"Our week",text}).catch(e=>{if(!e||e.name!=="AbortError") copyText(text);}); return;}
  if(a==="copy-week"){copyText(weekText()); return;}
  if(a==="import-paste"){const w=readWeekCode($("#import-code").value); if(!w){toast("That does not look like a shared week. Paste the whole link."); return;} incoming=w; render(); window.scrollTo(0,0); return;}
  if(a==="import-no"){incoming=null; dropWeekQuery(); render(); return;}
  if(a==="store"){if(S.store===el.dataset.v) return; S.store=el.dataset.v;}
  else if(a==="swap"){const k=el.dataset.id; const cur=storeFor(k,totals().T[k]||0); S.src[k]=cur==="c"?"t":"c";}
  else if(a==="add"){if(!addRecipe(el.dataset.id,m)) return;}
  else if(a==="gen"){if(!genWeek()) return; openWeek.clear(); toast("Week ready. Shuffle for a different mix.");}
  else if(a==="clear"){openWeek.clear(); for(const k of MK) arr(k).fill(null); S.checked={}; toast("Week cleared");}
  else if(a==="preset"){if(!loadPreset(el.dataset.id)) return; openWeek.clear(); toast("Sample week loaded. Swap anything."); if(tab()==="discover") setTimeout(()=>{location.hash="#week";},0);}
  else if(a==="cnt"){const k=el.dataset.k, v=S[k]+(+el.dataset.d); if(v<0||v>7) return; S[k]=v;}
  else if(a==="pick"){if(ev.type!=="change"||!el.value) return; arr(m)[d]={r:el.value,double:false};}
  else if(a==="remove"){arr(m)[d]=null; openWeek.delete(m+":"+d);}
  else if(a==="double"){arr("d")[d].double=!arr("d")[d].double;}
  else if(a==="move"){const j=d+(+el.dataset.dir); if(j<0||j>=cnt(m)) return; const A=arr(m); [A[d],A[j]]=[A[j],A[d]];
    const kd=m+":"+d, kj=m+":"+j, od=openWeek.has(kd), oj=openWeek.has(kj); openWeek.delete(kd); openWeek.delete(kj); if(od) openWeek.add(kj); if(oj) openWeek.add(kd);
    setTimeout(()=>{const b=document.getElementById((+el.dataset.dir<0?"up-":"down-")+m+"-"+j); if(b&&!b.disabled) b.focus({preventScroll:true});},0);}
  else if(a==="order"){openWeek.clear(); orderByFreshness(); pairBreakfasts(); toast("Reordered so fresh meat and fish come first");}
  else if(a==="life"){const k=el.dataset.id, v=lifeOf(k)+(+el.dataset.d); if(v<1||v>60) return; if(v===I[k].life) delete S.life[k]; else S.life[k]=v;}
  else if(a==="life-reset"){delete S.life[el.dataset.id];}
  else if(a==="hh"){const k=el.dataset.k, v=S[k]+(+el.dataset.d); if(v<(k==="adults"?1:0)||v>(k==="adults"?8:6)) return; S[k]=v;}
  else if(a==="shopday"){if(ev.type!=="change") return; S.shopDay=+el.value;}
  else if(a==="cook"){S.cook=el.dataset.v;}
  else if(a==="rotis"){S.rotis=el.dataset.v==="true";}
  else if(a==="chef"){S.chef=el.dataset.v==="true";}
  else if(a==="style"){S.style=el.dataset.v;}
  else if(a==="need"){const v=el.dataset.v; S.needs=S.needs.includes(v)?S.needs.filter(x=>x!==v):[...S.needs,v];}
  else if(a==="stock"){if(ev.type!=="change"||!el.value) return; S.stock[el.value]=true;}
  else if(a==="unstock"){delete S.stock[el.dataset.id];}
  else if(a==="stock-basics"){for(const k of ["banana","blueberry","yogurt","avocado","cucumber","hummus","pita","cheese","oats"]) S.stock[k]=true; toast("Play kitchen basics added");}
  else if(a==="kidp"){S.kidPortion=+el.dataset.v;}
  else if(a==="rep"){S.rep[m]=+el.dataset.v;}
  else if(a==="prep"){S.prepDays^=1<<(+el.dataset.w);}
  else if(a==="check"){if(ev.type!=="change") return; if(el.checked) S.checked[el.dataset.id]=true; else delete S.checked[el.dataset.id];}
  else if(a==="uncheck"){S.checked={};}
  else if(a==="setup"){S.setup=true; if(el.dataset.gen){genWeek(); toast("Your first week is ready. Shuffle for a different mix.");} window.scrollTo(0,0);}
  else if(a==="tune-reset"){S.tune={}; toast("Planner settings back to defaults");}
  else if(a==="import-yes"){if(!incoming) return; for(const f of SHARE_FIELDS) S[f]=incoming.data[f]; S.setup=true; S.checked={}; incoming=null; dropWeekQuery(); toast("Shared week loaded");}
  else return;
  const {T,st}=totals(); for(const k of Object.keys(S.checked)) if(k.startsWith("st:")?!st.includes(k.slice(3)):!(k in T)&&!S.stock[k]) delete S.checked[k];
  persist(); render();
}
document.addEventListener("click",e=>{const el=e.target.closest("button[data-act]"); if(el){act(el,e); return;}
  /* a tap anywhere on a closed meal card opens it; once open, use the title to close */
  const card=e.target.closest(".day[data-key]:not(.open)"); if(card&&!e.target.closest("a,select,input,label,summary")){const t=card.querySelector(".rtitle"); if(t) act(t,e);}});
document.addEventListener("change",e=>{const el=e.target.closest("select[data-act],input[data-act]"); if(el) act(el,e);});
document.addEventListener("input",e=>{if(e.target.id==="rq"){rsearch=e.target.value; applySearch();}
  if(e.target.dataset&&e.target.dataset.act==="tune"){const t=TUNEX[e.target.dataset.k], o=$("#tno-"+t.k), w=tuneFmt(t,fromSlider(t,+e.target.value)); if(o) o.textContent=w; e.target.setAttribute("aria-valuetext",w);}});
document.addEventListener("toggle",e=>{const el=e.target; if(!el.dataset) return;
  if(el.dataset.rid){if(el.open) openSet.add(el.dataset.rid); else openSet.delete(el.dataset.rid);}
  if(el.dataset.sk){if(el.open) openStore.add(el.dataset.sk); else openStore.delete(el.dataset.sk);}},true);
window.addEventListener("hashchange",()=>{render(); window.scrollTo(0,0);});
render();
</script>
